[pytest]
asyncio_default_fixture_loop_scope = function
norecursedirs = pipeline common devices
addopts = -q
# 说明：本目录的测试不使用 pytest 的 tmp_path（它固定建在系统临时目录，
# 在部分 Windows 账户/受限 ACL 的机器上会 WinError 5）。测试自己在
# <仓库>/.temp 或 Bot/.temp 下创建带唯一后缀的临时目录，都不可写时才退回系统临时目录；
# 可用环境变量 DSH_TEST_TMP 指定。
#
# 收集规则：
#   - 本目录（Bot/tests/*.py）为**离线单元测试**，不需要 Core 模型服务在线，
#     从仓库根直接跑即可：python -m pytest Bot/tests
#   - pipeline/ 下的脚本需要真实的 ASR / LLM / TTS 服务在线，属人工调试脚本，
#     已通过 norecursedirs 排除，需要时手动运行单个文件。
