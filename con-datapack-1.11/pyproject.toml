[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "con-datapack"
version = "1.11"
description = "本项目各模块间共享的数据协议包（导入名 condata）；早期骨架的版权声明（MIT, (c) 2024 AkagawaTsurunaki）见 LICENSE。"
authors = [
    {name = "AkagawaTsurunaki"},
    {name = "STEXxx"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.10.1,<3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/condata"]

[tool.hatch.build]
dev-mode-exact = true