name: 💡 功能建议
description: 想要新的能力，或者觉得某处应该改
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议~ 说清「你想做成什么样」和「为什么」就足够了，实现方式我来想办法。

        两个小提示：
        - 如果只是想**换模型 / 加一个模型服务**，多半不用改代码 —— README 的「模型组合怎么搭」讲了怎么靠配置换实现；
        - 涉及界面、语音链路这类大改动的建议，附一张草图或参考产品会好谈很多。

  - type: textarea
    id: scenario
    attributes:
      label: 你想解决什么场景
      description: 描述你实际遇到的处境，比"我想要 XX 功能"更容易落地
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么表现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案 / 现在怎么绕过去的
      description: 也可以写「别的项目是怎么做的」
    validations:
      required: false

  - type: dropdown
    id: willing
    attributes:
      label: 愿意自己动手实现吗
      options:
        - 只提需求，实现交给你
        - 我可以试着实现，需要指路
        - 我已经写好了，可以直接提 PR
    validations:
      required: false
