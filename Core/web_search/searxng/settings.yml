use_default_settings:
  engines:
    keep_only:
      - bing

general:
  debug: false
  instance_name: "SearXNG"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

engines:
  - name: bing
    disabled: false
    timeout: 4.0